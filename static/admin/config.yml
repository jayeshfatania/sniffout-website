backend:
  name: github
  repo: jayeshfatania/sniffout-website
  branch: main
  base_url: https://sniffout-cms-auth.sniffout.workers.dev
  auth_endpoint: /auth
  auth_scope: repo

media_folder: static/img
public_folder: /img

collections:

  - name: "walks"
    label: "Walk Pages"
    folder: "content/walks"
    create: false
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description (SEO)", name: "description", widget: "string" }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "County", name: "county", widget: "string", required: false }
      - { label: "Area", name: "area", widget: "string", required: false }
      - { label: "Distance", name: "distance", widget: "string" }
      - { label: "Difficulty", name: "difficulty", widget: "select", options: ["Easy", "Moderate", "Challenging"] }
      - { label: "Terrain", name: "terrain", widget: "string" }
      - { label: "Off-lead", name: "offLead", widget: "string" }
      - { label: "Duration", name: "duration", widget: "string" }
      - { label: "Parking", name: "parking", widget: "string", required: false }
      - { label: "Hero Image", name: "heroImage", widget: "string", required: false }
      - { label: "Date", name: "date", widget: "datetime", required: false }
      - { label: "Nearest Town", name: "nearestTown", widget: "string", required: false }
      - { label: "Getting There", name: "gettingThere", widget: "string", required: false }
      - { label: "Facilities", name: "facilities", widget: "string", required: false }
      - { label: "Access Notes", name: "accessNotes", widget: "string", required: false }
      - { label: "Water on Route", name: "waterOnRoute", widget: "string", required: false }
      - { label: "Shade on Route", name: "shadeOnRoute", widget: "string", required: false }
      - { label: "Dog Facilities", name: "dogFacilities", widget: "string", required: false }
      - { label: "Wet Weather Note", name: "wetNote", widget: "string", required: false }
      - { label: "Hot Weather Note", name: "hotNote", widget: "string", required: false }
      - { label: "Has Stiles", name: "hasStiles", widget: "boolean", default: false, required: false }
      - { label: "Livestock", name: "livestock", widget: "boolean", default: false, required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "guides"
    label: "Guide Articles"
    folder: "content/guides"
    create: false
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description (SEO)", name: "description", widget: "string" }
      - { label: "Category", name: "category", widget: "string", required: false }
      - { label: "Read Time", name: "readTime", widget: "string", required: false }
      - { label: "Author", name: "author", widget: "string", required: false }
      - { label: "Author Role", name: "authorRole", widget: "string", required: false }
      - { label: "Fact Checked", name: "factChecked", widget: "boolean", default: false, required: false }
      - { label: "Hero Image", name: "heroImage", widget: "string", required: false }
      - { label: "Pull Quote", name: "pullQuote", widget: "string", required: false }
      - { label: "Date", name: "datetime", required: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "areas"
    label: "Area Pages"
    folder: "content/areas"
    create: false
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description (SEO)", name: "description", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
