<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /><title>Authenticating...</title></head>
<body>
<p>Completing authentication...</p>
<script>
(function() {
  var hash = window.location.hash.substring(1);
  var params = {};
  hash.split('&').forEach(function(part) {
    var eq = part.indexOf('=');
    if (eq > -1) {
      params[part.substring(0, eq)] = decodeURIComponent(part.substring(eq + 1));
    }
  });
  var token = params.token;
  var provider = params.provider || 'github';
  if (token) {
    var message = 'authorization:' + provider + ':success:' + JSON.stringify({ token: token, provider: provider });
    if (window.opener) {
      window.opener.postMessage(message, location.origin);
      setTimeout(function() { window.close(); }, 100);
    } else {
      localStorage.setItem('decap-cms-token', token);
      window.location = '/admin/';
    }
  } else {
    document.body.innerHTML = '<p>Authentication failed. No token received.</p>';
  }
})();
</script>
</body>
</html>
