{{ if .Params.walkWarning }}
<div class="ws-walk-warning">
  <div class="ws-walk-warning-header">
    <div class="ws-walk-warning-icon">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    </div>
    <span class="ws-walk-warning-title">{{ .Params.walkWarning.title }}</span>
  </div>
  <p>{{ .Params.walkWarning.body | markdownify }}</p>
</div>
{{ end }}
